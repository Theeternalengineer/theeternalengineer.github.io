<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>With love, Gen</title>

  <link rel="stylesheet" href="style.css?v=7">
</head>

<body>

  <!-- PRIMERA SECCIÓN -->
<section id="hero">
  <div class="hero-box">
    <h1>
      Welcome back, quesadilla❤️<br><br>
      <span class="subtitle">
        Todo esto fue hecho con amor, dedicación y mucho café...
      </span><br><br>
      <span class="signature">
        -With love, Gen
      </span>
    </h1>
  </div>
</section>


  <!-- SEGUNDA SECCIÓN -->
  <section id="start">
    <h2>¿Comenzamos?</h2>

    <!-- SOLO BOTÓN INICIO -->
    <div class="choice-buttons">
      <button id="inicio" type="button" class="btn menu">
        Inicio
      </button>
    </div>
  </section>

  <script>
    const inicioBtn = document.getElementById("inicio");

    // Corazoncitos
    function hearts(e) {
      const count = 14;
      for (let i = 0; i < count; i++) {
        const heart = document.createElement("div");
        heart.className = "heart";
        document.body.appendChild(heart);

        const angle = Math.random() * Math.PI * 2;
        const radius = 10 + Math.random() * 34;

        const x = e.clientX + Math.cos(angle) * radius;
        const y = e.clientY + Math.sin(angle) * radius;

        heart.style.left = x + "px";
        heart.style.top = y + "px";

        setTimeout(() => heart.remove(), 1700);
      }
    }

    // Inicio → corazones + redirección
    inicioBtn.addEventListener("click", (e) => {
      hearts(e);
      setTimeout(() => {
        window.location.href = "inicio.html";
      }, 450);
    });
  </script>

</body>
</html>
