<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inicio</title>

  <link rel="stylesheet" href="style.css?v=8">
</head>

<body class="inicio-body">

  <main class="envelope-stage">
    <div class="envelope" id="envelope">
      <!-- Sobre -->
      <div class="env-back"></div>
      <div class="env-front"></div>
      <div class="env-flap"></div>

      <!-- Carta (sale del sobre) -->
      <div class="letter" id="letter">
        <!-- Hoja 1 -->
        <section class="page page-1 active" id="page1">
          <h1 class="love-title">La distancia no nos separa.</h1>
          <p class="love-text">
            Solo nos enseña a cuidarnos de otras formas,
  a estar presentes y a elegirnos igual.
          </p>

          <p class="love-hint">
            <span></span>
          </p>

          <!-- Zona clickeable lado derecho -->
          <button class="tap-right" id="nextPage" type="button" aria-label="Siguiente hoja"></button>
        </section>

        <!-- Hoja 2 -->
        <section class="page page-2" id="page2">
          <h2 class="valentine-title">Adriana, Wanna be my valentine? 💘</h2>

          <div class="choice-buttons">
            <button id="yes" type="button">Sipiriri</button>
            <button id="no" type="button">Nopororo</button>
          </div>

          <p class="love-hint small">
            <span></span>
          </p>
        </section>
      </div>
    </div>
  </main>

  <script>
    const envelope = document.getElementById("envelope");
    const nextPageBtn = document.getElementById("nextPage");

    const page1 = document.getElementById("page1");
    const page2 = document.getElementById("page2");

    const yesBtn = document.getElementById("yes");
    const noBtn = document.getElementById("no");

window.addEventListener("load", () => {
  // 1) un momento cerrado para que el usuario lo vea
  setTimeout(() => {
    envelope.classList.add("open");
  }, 500);
});


    // 2) Pasar de hoja al click del lado derecho
    nextPageBtn.addEventListener("click", () => {
      page1.classList.remove("active");
      page2.classList.add("active");
      envelope.classList.add("page2");
    });

    // Corazoncitos
    function hearts(e) {
      const count = 14;
      for (let i = 0; i < count; i++) {
        const heart = document.createElement("div");
        heart.className = "heart";
        document.body.appendChild(heart);

        const angle = Math.random() * Math.PI * 2;
        const radius = 10 + Math.random() * 34;

        const x = e.clientX + Math.cos(angle) * radius;
        const y = e.clientY + Math.sin(angle) * radius;

        heart.style.left = x + "px";
        heart.style.top = y + "px";

        setTimeout(() => heart.remove(), 1700);
      }
    }

    // Nopororo escapa
    function moveNoButton() {
      const x = Math.random() * 220 - 110;
      const y = Math.random() * 180 - 90;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    }
    noBtn.addEventListener("mouseenter", moveNoButton);
    noBtn.addEventListener("touchstart", (ev) => {
      ev.preventDefault();
      moveNoButton();
    }, { passive: false });

    // Sipiriri → corazones + redirección a seeu.html
    yesBtn.addEventListener("click", (e) => {
      hearts(e);
      setTimeout(() => {
        window.location.href = "seeu.html";
      }, 450);
    });
  </script>

</body>
</html>
