<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>See u</title>

  <link rel="stylesheet" href="style.css?v=1" />

  <style>
    html, body{
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body.seeu-body{
      height: 100svh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(14px, 3vw, 28px);
      background: url("Background.svg") center/cover no-repeat;
      position: relative;
    }

    /* CONTENEDOR PRINCIPAL */
    .seeu-panel{
      width: min(920px, 100%);
      text-align: center;
      display: grid;
      gap: 8px;
      align-content: start;
      background: transparent;
      border: none;
      box-shadow: none;
    }

    .seeu-title{
      margin: 0;
      font-size: clamp(26px, 4vw, 48px);
      line-height: 1.05;
      color: #3a1f1f;
      text-shadow: 0 2px 6px rgba(255,255,255,0.8);
    }

    .seeu-sub{
      margin: 0;
      font-size: clamp(13px, 1.8vw, 18px);
      color: rgba(58,31,31,0.9);
      text-shadow: 0 1px 4px rgba(255,255,255,0.7);
    }

    /* RELOJ */
    .countdown{
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(10px, 1.6vw, 14px);
      width: min(760px, 100%);
      margin: -110px auto 0;
      background: transparent;
      border: none;
      padding: 0;
    }

    .cd-box{
      border-radius: 16px;
      padding: clamp(12px, 2vw, 16px);
      background: rgba(255,255,255,0.75);
      border: 1px solid rgba(0,0,0,0.08);
      box-shadow: 0 10px 22px rgba(0,0,0,0.12);
    }

    .cd-num{
      margin: 0;
      font-size: clamp(30px, 5.4vw, 58px);
      font-weight: 700;
      color: #3a1f1f;
    }

    .cd-lab{
      margin-top: 8px;
      font-size: 12px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      opacity: 0.85;
      font-weight: 600;
      color: #3a1f1f;
    }

    .cd-foot{
      margin-top: 8px;
      font-size: 12.5px;
      color: rgba(58,31,31,0.85);
      text-shadow: 0 1px 4px rgba(255,255,255,0.7);
    }

    /* BOTÓN MENÚ */
    .menu-btn{
      position: absolute;
      bottom: 6vh; /* casi hasta abajo */
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 34px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 999px;
      border: 1px solid rgba(58,31,31,0.25);
      background: rgba(255,255,255,0.55);
      color: #3a1f1f;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: all 0.25s ease;
    }

    .menu-btn:hover{
      background: rgba(255,255,255,0.85);
      transform: translateX(-50%) translateY(-2px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    }

    @media (max-width: 520px){
      .countdown{
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>

<body class="seeu-body">
  <main class="seeu-panel">
    <h1 class="seeu-title">Entonces nos vemos en…</h1>
    <p class="seeu-sub" id="targetText"></p>

    <section class="countdown">
      <div class="cd-box">
        <p class="cd-num" id="d">--</p>
        <p class="cd-lab">Días</p>
      </div>
      <div class="cd-box">
        <p class="cd-num" id="h">--</p>
        <p class="cd-lab">Horas</p>
      </div>
      <div class="cd-box">
        <p class="cd-num" id="m">--</p>
        <p class="cd-lab">Min</p>
      </div>
      <div class="cd-box">
        <p class="cd-num" id="s">--</p>
        <p class="cd-lab">Seg</p>
      </div>
    </section>

    <div class="cd-foot">Sincronizado a tu reloj local</div>
  </main>

  <!-- BOTÓN -->
  <button class="menu-btn" onclick="window.location.href='menu.html'">
    Menú
  </button>

  <script>
    const $d = document.getElementById("d");
    const $h = document.getElementById("h");
    const $m = document.getElementById("m");
    const $s = document.getElementById("s");
    const $targetText = document.getElementById("targetText");

    function pad2(n){ return String(n).padStart(2, "0"); }

    function getTargetDateLocal(){
      const now = new Date();
      let year = now.getFullYear();
      let target = new Date(year, 1, 13, 0, 0, 0, 0);

      if (now > target){
        year += 1;
        target = new Date(year, 1, 13, 0, 0, 0, 0);
      }

      
      return target;
    }

    let targetDate = getTargetDateLocal();

    function tick(){
      const now = new Date();
      let diff = targetDate - now;

      if (diff <= 0){
        targetDate = getTargetDateLocal();
        diff = targetDate - now;
      }

      const total = Math.floor(diff / 1000);
      $d.textContent = Math.floor(total / 86400);
      $h.textContent = pad2(Math.floor((total % 86400) / 3600));
      $m.textContent = pad2(Math.floor((total % 3600) / 60));
      $s.textContent = pad2(total % 60);

      requestAnimationFrame(tick);
    }

    tick();
  </script>
</body>
</html>
